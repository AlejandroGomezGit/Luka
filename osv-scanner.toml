# Excepciones de osv-scanner (T-043). Cada una lleva su motivo y caduca en 90 días o menos: al vencer,
# el job «Dependencias» vuelve a fallar y scripts/osv-ignores.mjs lo avisa. Se revisan con cada
# cambio de versión del SDK de Expo. Aprobadas el 2026-10-04; las de zod, deepmerge y la segunda de
# decode-uri-component, el 2026-10-29.

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "decode-uri-component 0.2.2 entra en la app vía query-string 7 de expo-router (lee las URL luka://). Una URL maliciosa abierta por la persona podría congelar la app; no expone datos. La versión corregida (0.5.0) es solo ESM y query-string 7 la carga con require: forzarla rompe expo-router. Se espera el parche de Expo (DT-09)."

