name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    # HU-11: el pipeline termina en menos de 10 minutos.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache
      # Integración de la API contra PostgreSQL y Redis reales con Testcontainers.
      - run: pnpm test:api
      # build de @luka/mobile empaqueta iOS con Metro (valida R-06); expo-doctor revisa versiones del SDK.
      - run: pnpm dlx expo-doctor
        working-directory: apps/mobile

  infra:
    name: Arranque limpio de Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RNF-12: falla si algún servicio no queda healthy (el de S3 incluye el bucket).
      - run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
