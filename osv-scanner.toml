reason = "esbuild 0.18.20 solo está en drizzle-kit (generar migraciones), que no levanta el servidor de desarrollo de esbuild afectado. La corrección (0.25) va dentro de un paquete abandonado de drizzle-kit; Renovate propondrá actualizar drizzle-kit."

[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "decode-uri-component 0.2.2 entra en la app (en el bundle de iOS) vía query-string 7 de expo-router, que decodifica la consulta de las URL que abre la app (luka://, y exp:// en Expo Go). Camino de explotación: alguien hace que la persona abra un enlace luka:// con una consulta de cientos de KB llena de secuencias %XX malformadas; decodeURIComponent nativo falla, el respaldo de la librería tarda en tiempo cuadrático y bloquea el hilo de JavaScript (unos 20 s con 224 KB en Node). Impacto: la app se congela hasta que se cierra; no expone datos, no ejecuta código ni deja nada guardado, y los enlaces que arma la propia app están bien formados. La corrección (0.5.1) es solo ESM y query-string 7 la carga con require: forzarla rompe expo-router (como en GHSA-vcc3-ghjq-m6fr, DT-09). Se espera el parche de Expo."

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
