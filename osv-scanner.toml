reason = "zod 3.25.76 solo está en @expo/cli (herramienta de desarrollo, valida su propia configuración), no en la app (0 módulos de zod en el bundle de iOS) ni en la API, que usa zod 4.6.6, ya corregido. El aviso requiere validar un arreglo enorme enviado por un atacante; @expo/cli solo valida archivos del proyecto. No hay versión 3.x corregida: 3.25.76 es la última."

[[IgnoredVulns]]
